<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Document</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap5-toggle@5.0.4/css/bootstrap5-toggle.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
        <link rel="stylesheet" href="../static/main.css">
        <style>
            .container {
                max-width: 75rem;
                margin-left: auto;
                margin-right: auto;
            }
            .cafe-name {
                margin-top: 30px;
            }
            .images {
                margin-left: 600px;
                margin-top: -40px;
                border: solid 1px black;
                background-color: rgb(204, 163, 81); 
                border-radius: 75px;
                border-width: 2px;
                width: 200px;
                text-align: center;
                box-shadow: 1px 5px 5px grey;
            }
            input::placeholder{
                opacity: 0.45;
            }
            .images:hover{
                background-color: rgb(134, 91, 5);
                color: white;
                border-radius: 75px;
                box-shadow: none;
            }
            label *:not(.btn){
                margin-left: 50px;
            }
            .municipalities {
                margin-top: -61.8px;
                margin-left: 500px;
            }
            .cafe-name, .postal-code, .prefectures {
                margin-top: 30px;
            }
            input {
                line-height: 2em;
                margin-left: 50px;
                border-width: 2px;
                border-radius: 10px;
            }
            .sub {
                margin-top: 30px;
                margin-left: 750px;
                border-radius: 75px;
                border: solid 1px black;
                width: 220px;
                background-color: rgb(204, 163, 81);
                box-shadow: 1px 5px 5px grey;
            }
            .sub:hover{
                background-color: rgb(134, 91, 5);
                color: white;
                box-shadow: none;
            }
            .cafe-details{
                margin-top: 30px;
            }
            textarea {
                margin-left: 50px;
                max-width: 100%;
                line-height: 1.5;
                border-radius: 5px;
                border: 1px solid #ccc;
                box-shadow: 1px 1px 1px #999;
            }
            .opening-hours {
                margin-top: 30px;
            }
            .upload-status {
                margin-top: 10px;
                padding: 10px;
                border-radius: 5px;
                display: none;
            }
            .upload-success {
                background-color: #d4edda;
                border: 1px solid #c3e6cb;
                color: #155724;
            }
            .upload-error {
                background-color: #f8d7da;
                border: 1px solid #f5c6cb;
                color: #721c24;
            }
        </style>
    </head>
    <body>
        <header class="own-container d-flex align-items-center">
                <div class="logo d-flex align-items-center"><a href="/"><img src="../static/img/cafe.png" alt=""></a></div>
                <!------------------------------------------------- add your cafe ---------------------------------------------------------------->
                <div class="right-bar d-flex justify-content-end">
                    <div class="navbar d-flex justify-content-end">
                        <!-------------------------------- login --------------------------------------------------->
                        <div class="dropdown">
                            <button class="btn dropdown-toggle d-flex align-items-center" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <div class="hamburger me-3">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                                <img src="../static/img/user-icon.svg" alt="">
                            </button>
                            <ul class="dropdown-menu">
                                {% if session.get('user_id') %}
                                <li><a class="dropdown-item" href="/logout">ログアウト</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="/my-cafes">My Cafes</a></li>
                                <li><a class="dropdown-item" href="/upload">カフェを掲載する</a></li>
                                <li><a class="dropdown-item" href="/b/{{ session.get('user_id') }}">予約を管理する</a></li>
                                {% else %}
                                <li><a class="dropdown-item" href="/register">登録する</a></li>
                                <li><a class="dropdown-item" href="/login">ログイン</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                {% endif %}
                            </ul>
                        </div>
                    </div>
                </div>
        </header>
        
        {% if not session.get('user_id') %}
        <div style="text-align: center; margin: 50px; padding: 20px; background-color: #f8f9fa; border-radius: 10px;">
            <h3>ログインが必要です</h3>
            <p>カフェを追加するには、まずログインしてください。</p>
            <a href="/login" class="btn btn-primary">ログイン</a>
            <a href="/register" class="btn btn-secondary">登録</a>
        </div>
        {% else %}
        <div id="container"class="container">
            <form action="/upload" method="post" enctype="multipart/form-data">
                <div class="cafe-name">
                    <label for="cafe_name"><strong>カフェ名</strong></label><br>
                    <input type="text" name="cafe_name" placeholder="カフェ名" size="50" height="50" required>
                </div>
                <div class="images" onclick="document.getElementById('images').click();">
                    <label for="images" style="font-weight: bold; padding: 5px;">画像追加</label>
                    <input id="images" type="file" name="images[]" multiple accept="image/png, image/jpeg" style="display:none;">
                </div>
                <div class="upload-status" id="uploadStatus"></div>
                <div class="cafe-details">
                    <label id="details" for="cafe_details"><strong>カフェ詳細</strong></label><br>
                    <textarea name="cafe_details" placeholder="カフェ詳細" rows="4" cols="50" required></textarea>
                </div>
                <div class="opening-hours">
                    <label for="opening_hours"><strong>営業時間</strong></label><br>
                    <input type="text" name="opening_hours" placeholder="営業時間" size="50" required>
                </div>
                <div class="postal-code">
                    <label for="postal_code"><strong>郵便番号</strong></label><br>
                    <input type="text" name="postal_code" placeholder="郵便番号" size="50" required>                
                </div>
                <div class="prefectures">
                    <label for="prefectures"><strong>都道府県</strong></label><br>
                    <input type="text" name="prefectures" size="50" placeholder="都道府県" required>
                </div>
                <div class="municipalities">
                    <label for="municipalities"><strong>市区町村</strong></label><br>
                    <input type="text" name="municipalities" size="50" placeholder="市区町村" required>
                </div>
                <div class="submit">
                    <input type="submit" value="登録する" class="sub" style="font-weight: bold; border-width: 2px;">
                </div>
            </form>
        </div>  
        {% endif %}
        
        <div class="bootstrap">
            <script src="https://code.jquery.com/jquery-3.7.0.slim.min.js"
            integrity="sha256-tG5mcZUtJsZvyKAxYLVXrmjKBVLd6VpVccqz/r4pFE" crossorigin="anonymous"></script>
            <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"></script>
            <script type="module" src="http://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
            <script nomodule src="http://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap5-toggle@5.0.4/js/bootstrap5-toggle.j-query.min.js"></script>
            <script>
            async function uploadImageToS3(file) {
                // Always use server upload
                const formData = new FormData();
                formData.append('file', file);

                const serverResponse = await fetch('/upload_file_server', {
                    method: 'POST',
                    body: formData
                });

                if (!serverResponse.ok) {
                    const errorData = await serverResponse.json();
                    throw new Error(errorData.error || 'Server upload failed');
                }

                const serverData = await serverResponse.json();
                return serverData.url;
            }

            document.querySelector('form').addEventListener('submit', async function(e) {
                e.preventDefault(); // Prevent default form submission

                const form = e.target;
                const files = form.querySelector('input[type="file"]').files;
                const imageUrls = [];
                const statusDiv = document.getElementById('uploadStatus');

                try {
                    // Show upload status
                    statusDiv.style.display = 'block';
                    statusDiv.style.marginLeft = '550px';
                    statusDiv.style.width = '250px';
                    statusDiv.className = 'upload-status';
                    statusDiv.textContent = '画像をアップロード中...';

                    // Upload each file to S3 and collect URLs
                    for (let i = 0; i < files.length; i++) {
                        const url = await uploadImageToS3(files[i]);
                        imageUrls.push(url);
                    }

                    
                    // Show success status
                    statusDiv.className = 'upload-status upload-success';
                    statusDiv.textContent = `${imageUrls.length}個の画像がアップロードされました`;

                    // Now, send the rest of the form data + image URLs to your backend
                    const formData = new FormData(form);
                    // Remove the files from FormData (since they're already uploaded)
                    formData.delete('images[]');
                    // Add the image URLs as a JSON string
                    formData.append('image_urls', JSON.stringify(imageUrls));

                    // Submit the form data to your backend
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.redirected) {
                        window.location.href = response.url;
                    } else {
                        const text = await response.text();
                        console.error('Upload failed:', text);
                        statusDiv.className = 'upload-status upload-error';
                        statusDiv.textContent = 'アップロードに失敗しました。コンソールを確認してください。';
                    }
                } catch (err) {
                    console.error('Error during upload:', err);
                    statusDiv.className = 'upload-status upload-error';
                    statusDiv.textContent = `アップロードエラー: ${err.message}`;
                }
            });
            </script>
        </div>
    </body>
</html>
